kind = "web"
previewPath = "/"
title = "Le Miroir de Ratiss"
version = "1.0.0"
id = "artifacts/miroir-de-ratiss"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21380

[services.development]
run = "pnpm --filter @workspace/miroir-de-ratiss run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/miroir-de-ratiss", "run", "build" ]
publicDir = "artifacts/miroir-de-ratiss/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21380"
BASE_PATH = "/"
